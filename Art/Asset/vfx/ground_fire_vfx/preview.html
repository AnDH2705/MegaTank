<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MegaTank · Ground Fire VFX</title>
<style>*{box-sizing:border-box}body{margin:0;background:#17151c;color:#f8f0df;font:15px system-ui,sans-serif}main{max-width:1300px;margin:auto;padding:20px}h1{font-size:24px;margin:0 0 8px}p{color:#c8bfb6;line-height:1.5}canvas{width:100%;height:auto;display:block;background:#1b1522;border:1px solid #5b4c40;border-radius:8px}.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:center;background:#29232b;padding:18px;border-radius:8px;margin-top:14px}label{display:flex;gap:9px;align-items:center}input[type=range]{width:150px;accent-color:#ffbb38}button{padding:8px 15px;font:inherit;color:#fff2cc;background:#54402b;border:1px solid #af8244;border-radius:5px}output{font-variant-numeric:tabular-nums}small{color:#b9aaa0}#status{min-height:23px}@media(max-width:640px){main{padding:10px}.controls{gap:12px}label{width:100%}}</style>
<main><h1>Ground Fire · lửa mặt đất</h1><p>Lõi trắng vàng, ngọn cam nóng, glow mềm và tàn lửa nhấp nháy. Kéo hai mép để thử vùng cháy.</p><canvas id="scene" width="1920" height="1080"></canvas><div class="controls"><button id="pause">Tạm dừng</button><button id="restart">Chạy lại</button><label><input id="city" type="checkbox" checked>Nền game</label><label><input id="glow" type="checkbox" checked>Glow</label><label><input id="particles" type="checkbox" checked>Tàn lửa / lóe sáng</label><label>Mép trái<input id="start" type="range" min="80" max="1500" value="320"></label><label>Mép phải<input id="end" type="range" min="160" max="1840" value="1600"></label><label>Độ cao<input id="scale" type="range" min=".5" max="1.5" step=".05" value="1"></label></div><p id="status">Đang tải…</p><small>Sprite PNG alpha và các lớp glow/particle được giữ riêng. Mở trực tiếp thư mục này để xem; không cần mạng.</small></main>
<script src="ground_fire.js"></script><script>
let fire,bg,paused=false,last=0,clock=0;const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),ui=Object.fromEntries(['start','end','scale','city','glow','particles','pause','restart','status'].map(id=>[id,document.getElementById(id)]));
function inputs(){if(!fire)return;fire.scale=+ui.scale.value;fire.glowIntensity=ui.glow.checked?.7:0;fire.particles=ui.particles.checked;fire.setRange(+ui.start.value,+ui.end.value,1000);}
function paint(){if(!fire)return;ctx.clearRect(0,0,1920,1080);if(ui.city.checked)ctx.drawImage(bg,0,0,1920,1080);else{ctx.fillStyle='#1b1522';ctx.fillRect(0,0,1920,1080);}fire.draw(ctx);}
for(const id of ['start','end','scale','city','glow','particles'])ui[id].oninput=()=>{inputs();paint();};
ui.pause.onclick=()=>{paused=!paused;ui.pause.textContent=paused?'Tiếp tục':'Tạm dừng';};ui.restart.onclick=()=>{clock=0;if(fire){fire.restart();paint();}};
window.renderAt=t=>{if(!fire)throw Error('Assets not loaded');window.previewFrozen=true;clock=t;fire.time=t;fire.age=t;fire.active=true;inputs();paint();};
function tick(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(fire&&!window.previewFrozen){if(!paused){clock+=dt;fire.update(dt);}paint();}requestAnimationFrame(tick);}
Promise.all([loadGroundFireTextures('assets'),new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src='assets/background_preview.jpg';})]).then(([textures,background])=>{bg=background;fire=new GroundFireVFX(textures,{xStart:320,xEnd:1600,groundY:1000,glowIntensity:.7});window.fire=fire;inputs();paint();window.previewReady=true;ui.status.textContent='Đã tải · 8 frame loop + glow + particle tàn lửa. Unity: MegaTank VFX → Build Ground Fire.';}).catch(()=>ui.status.textContent='Không tải được asset. Giữ nguyên assets/ cạnh preview.html.');requestAnimationFrame(tick);
</script></html>
