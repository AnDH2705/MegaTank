<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MegaTank · Event Timeline</title><style>*{box-sizing:border-box}body{margin:0;background:#d5dfda;color:#211e28;font:16px system-ui,sans-serif}main{max-width:1000px;margin:30px auto;padding:24px}h1{font-size:24px}.strip{width:800px;max-width:100%;margin:30px auto;background:#d5dfda}.controls{display:flex;flex-wrap:wrap;gap:18px;align-items:center}button{background:#ffd43b;color:#17151d;border:3px solid #17151d;padding:10px 18px;font:900 italic 16px Arial;box-shadow:3px 3px #17151d;cursor:pointer}input{accent-color:#dd554a;width:250px}#icons{display:block;width:100%;margin-top:35px}p{color:#5f6465;line-height:1.5}</style><main><h1>Sự kiện tiếp theo</h1><p>Mũi tên luôn ở giữa. Sự kiện mới chui ra từ boss; qua sự kiện thì mốc cũ trôi sang trái. Boss vào giữa khi đánh trận cuối.</p><div class="strip" id="timeline"></div><div class="controls"><button id="play">Dừng xe</button><button id="next">Qua sự kiện</button><button id="reset">Chạy lại</button><input id="progress" type="range" min="0" max="100" value="0" aria-label="Tiến độ di chuyển"><output id="status"></output></div><img id="icons" src="icons-preview.png" alt="6 icon sự kiện"></main><script src="event-timeline.js"></script><script>
const kinds=["battle","hard_battle","ammo","unknown","hp","boss"],route=kinds.map((type,i)=>({id:"event-"+i,type})),assets=Object.fromEntries(kinds.map(k=>[k,"icons/event_"+k+".png"]));let timeline,cursor=0,progress=0,running=true,last=performance.now();const ui=Object.fromEntries(["play","next","reset","progress","status"].map(id=>[id,document.getElementById(id)]));function paint(){if(!timeline)return;timeline.render({cursor,progress,heading:["battle","hard_battle"].includes(route[cursor].type)?"WAVE":TankEventTimeline.LABELS[route[cursor].type],caption:["battle","hard_battle"].includes(route[cursor].type)?"01 / 02":"",paused:!running});ui.progress.value=Math.round(progress*100);ui.status.textContent=cursor>=5?"ĐÃ TỚI BOSS":running?"XE ĐANG CHẠY":"XE ĐÃ DỪNG";ui.play.textContent=running?"Dừng xe":"Xe chạy";}function next(){cursor=Math.min(5,cursor+1);progress=0;paint();}ui.next.onclick=next;ui.reset.onclick=()=>{cursor=0;progress=0;running=true;paint();};ui.play.onclick=()=>{running=!running;paint();};ui.progress.oninput=()=>{running=false;progress=+ui.progress.value/100;paint();};window.demoFrame=(c,p)=>{running=false;cursor=c;progress=p;paint();};Promise.all(kinds.map(k=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=reject;im.src=assets[k];}))).then(()=>{timeline=new TankEventTimeline.EventTimeline(document.getElementById("timeline"),assets);timeline.setRoute(route);window.timeline=timeline;paint();window.previewReady=true;});function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(timeline&&running&&cursor<5){progress+=dt*.25;if(progress>1){next();}paint();}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
