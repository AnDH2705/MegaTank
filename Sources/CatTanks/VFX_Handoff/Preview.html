.layout{display:grid;grid-template-columns:minmax(232px,286px) minmax(0,1fr);gap:18px;align-items:start}
aside,.stage{border:1px solid var(--edge);background:var(--panel);border-radius:14px;overflow:hidden}
.chooser{padding:13px;display:grid;gap:9px;border-bottom:1px solid var(--edge)}
.chooser label{font-size:12px;color:var(--muted);display:block}
.chooser input,.chooser select{width:100%}
.items{padding:9px;display:grid;gap:5px;max-height:545px;overflow:auto}
.items button{border-color:transparent;background:transparent;text-align:left;padding:8px 10px;white-space:normal}
.items button:hover{background:#1e3045} .items button[aria-pressed=true]{border-color:#ae823b;background:#342b28}
.items small{display:block;font-size:11px;color:var(--muted);letter-spacing:.025em}
.panel-heading{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.meta{color:var(--muted);font-size:12px}
.viewport{position:relative;overflow:hidden;background:#101d32}
canvas{width:100%;display:block;aspect-ratio:16/9}
.stamp{position:absolute;bottom:10px;left:12px;color:#def6ff;background:#0a1625dd;padding:3px 8px;border-radius:6px;font:12px ui-monospace,monospace}
.controls{padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
.controls .time{flex:1;min-width:165px}
input[type=range]{accent-color:var(--hot);width:100%}
.status{border-top:1px solid var(--edge);padding:10px 16px;font-size:12px;color:var(--muted)}
@media (max-width:760px){main{width:calc(100% - 24px);margin:20px auto}.layout{grid-template-columns:1fr}aside{order:2}.items{max-height:260px;grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start}.chooser{grid-template-columns:1fr 1fr}.panel-heading{align-items:start;flex-direction:column}}
</style>

  if(tint==='#ffffff')ctx.drawImage(atlas,tx,ty,n,n,-w/2,-h/2,w,h);
  else {
    const key=id+':'+tint;
    if(!tintCache.has(key)){
      const layer=document.createElement('canvas');layer.width=layer.height=n;
      const paint=layer.getContext('2d');
      paint.drawImage(atlas,tx,ty,n,n,0,0,n,n);
      paint.globalCompositeOperation='source-in';paint.fillStyle=tint;paint.fillRect(0,0,n,n);
      tintCache.set(key,layer);
    }
    ctx.drawImage(tintCache.get(key),-w/2,-h/2,w,h);
  }
  ctx.restore();visibleQuads++;
}
function segment(x,y,xx,yy,width,color,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.strokeStyle=color;ctx.lineWidth=width;
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(xx,yy);ctx.stroke();ctx.restore();visibleQuads++;
}
function effect(recipe,x,y,p,scale,seed,endX=x+300,endY=y-100){
  const phase=Math.max(0,Math.min(.99999,p)), size=recipe.size*scale;
  const scaleCount=Number($('quality').value);
  if(recipe.mode==='beam'||recipe.mode==='lightning'){
    const nodes=recipe.mode==='lightning'?(scaleCount<.5?4:7):1;
    let lastX=x,lastY=y;
    for(let i=1;i<=nodes;i++){
      const ax=x+(endX-x)*i/nodes;
      const ay=y+(endY-y)*i/nodes+(i===nodes?0:(hash(seed+Math.floor(p*7),i)-.5)*size*3);
      segment(lastX,lastY,ax,ay,size*.66,recipe.color,1-p);
      segment(lastX,lastY,ax,ay,size*.22,'#fff7e6',1-p);
      lastX=ax;lastY=ay;
    }
    if(recipe.id==='chain')effect(recipes.get('arc'),endX,endY,p,scale*.56,seed);
    return;
  }
  const angle=recipe.mode==='spin'?p*tau*2:0;
  const pulse=recipe.mode==='loop'? .95+.10*Math.sin(p*tau):1;
  if(recipe.mode==='trail'){
    x+=p*(endX-x); y+=p*(endY-y)-Math.sin(p*Math.PI)*49;
    const trail=recipe.id==='shot-rocket'?recipes.get('shot-fire').tile:recipes.get('shot-fast').tile;
    if(recipe.grain>=0&&recipe.count>0){
      const total=Math.ceil(recipe.count*scaleCount);
      for(let i=0;i<total;i++){
        const age=(i+1)/(total+1);
        tile(recipe.grain,x-size*(.36+age*1.8),y-age*16,size*(.35+.43*age),size*(.35+.43*age),seed+i,.42*(1-age));
      }
    }
    tile(trail,x-size*.48,y,size*1.4,size*.40,0,.77);
  }
  if(recipe.mode!=='particles')
    tile(recipe.tile+Math.floor(phase*recipe.frames),x,y,size*pulse,size*pulse*(recipe.id==='shield-loop'?1.4:recipe.id==='fall-shadow'?.35:1),angle,1,recipe.color);
  if(recipe.grain<0||recipe.frames===1&&recipe.mode!=='particles')return;
  const count=Math.round(recipe.count*scaleCount);
  for(let i=0;i<count;i++){
    const a=hash(seed,i)*tau, r=(.28+.40*hash(seed,i+19))*size*(1-(1-p)*(1-p));
    const s=size*(.08+.11*hash(seed,i+53))*(1-p*.55);
    tile(recipe.grain,x+Math.cos(a)*r,y-Math.sin(a)*r+p*p*size*.17,s,s,a+p*3,(1-p)*.92);
  }
}
function battlefield(elapsed){
  for(let i=0;i<11;i++){
    const q=(elapsed*1.7+i*.171)%1;
    const y=326+(i%3)*14;
    effect(recipes.get('shot-fast'),225,y,q,.78,i,730,y);
    if(q<.7)effect(recipes.get('flash'),218,y,q*1.4,.66,i);
    if(q>.66)effect(recipes.get('hit'),719+i%4*22,y,(q-.66)*2.9,.78,i);
  }
  const shell=(elapsed*.68)%1;
  effect(recipes.get('shot-shell'),196,316,Math.min(1,shell/.56),.88,71,720,338);
  if(shell>.56)effect(recipes.get('blast'),720,338,(shell-.56)*2.2,.82,71);
  const rocket=(elapsed*.51+.34)%1;
  if(rocket<.54)for(let i=0;i<3;i++)effect(recipes.get('shot-rocket'),220,328-i*31,rocket/.54,.79,i+80,760+i*36,316+i*18);
  if(rocket>.54)for(let i=0;i<3;i++)effect(recipes.get('rocketblast'),760+i*36,316+i*18,(rocket-.54)*2.1,.70,i+39);
  const cycle=(elapsed*.83)%1;
  effect(recipes.get('chain'),400,260,cycle*.90,1,51,713,260);
  effect(recipes.get('frost'),735,397,cycle,1.06,39);
  effect(recipes.get('heal'),140,401,(cycle+.4)%1,1.04,70);
  effect(recipes.get('danger-zone'),643,405,cycle,1.01,17);
}
function updateHeading(){
  $('name').textContent=stress?'Bắn đồng thời':current.label;
  const technique=current.frames>1
    ? current.count ? 'Frame-by-frame + particle' : 'Frame-by-frame'
    : current.mode==='particles'?'Particle'
    : current.mode==='beam'||current.mode==='lightning'?'Hình học động'
    : current.count?'Sprite + particle':'Sprite / biến đổi';
  $('meta').textContent=stress?'Gatling, pháo, tên lửa, sét, băng và hồi máu':current.id+' · '+technique+' · '+(current.frames>1?current.frames+' frame · ':'')+current.seconds.toFixed(2)+' s';
}
function list(){
  const filter=$('group').value, key=$('search').value.trim().toLocaleLowerCase('vi');
  const items=$('items');items.replaceChildren();
  data.recipes.filter(r=>(!filter||r.group===filter)&&(!key||(r.label+' '+r.id).toLocaleLowerCase('vi').includes(key))).forEach(r=>{
    const button=document.createElement('button');
    button.type='button';button.setAttribute('aria-pressed',String(current.id===r.id&&!stress));
    button.append(document.createTextNode(r.label));
    const sub=document.createElement('small');sub.textContent=r.id;button.append(sub);
    button.addEventListener('click',()=>{current=r;clock=0;setStress(false);});items.append(button);
  });
  if(!items.firstChild){const none=document.createElement('p');none.className='muted';none.textContent='Không tìm thấy hiệu ứng.';items.append(none);}
}
function setPlaying(value){
  playing=value;$('play').textContent=value?'Tạm dừng':'Tiếp tục';$('play').setAttribute('aria-pressed',String(value));
}
function setStress(value){
  stress=value;$('stress').setAttribute('aria-pressed',String(value));updateHeading();list();
}
function tick(now){
  const dt=Math.min(.05,previous?(now-previous)/1000:0);previous=now;
  if(playing)clock+=dt*Number($('speed').value);
  ctx.drawImage(bg,0,0);visibleQuads=0;
  const period=stress?4:current.seconds+.28;
  const p=(clock%period)/period;
  if(stress)battlefield(clock);
  else {
    const life=p*period/current.seconds;
    if(life<1){
      const travel=current.mode==='trail';
      const beam=current.mode==='beam'||current.mode==='lightning';
      effect(current,travel?252:beam?212:482,travel?343:beam?376:342,life,1.62,79,beam?748:782,beam?313:298);
    }
  }
  if(playing)$('phase').value=p;
  const value=(stress?'Tải kết hợp':'Frame '+Math.min(current.frames,Math.floor(p*(current.seconds+.28)/current.seconds*current.frames)+1)+' / '+current.frames)+' · '+visibleQuads+' lớp';
  if(value!==lastReadout){$('readout').textContent=value;lastReadout=value;}
  requestAnimationFrame(tick);
}
for(const group of new Set(data.recipes.map(r=>r.group)))$('group').add(new Option(group,group));
$('group').addEventListener('change',list);
$('search').addEventListener('input',list);
$('stress').addEventListener('click',()=>{clock=0;setStress(!stress);});
$('play').addEventListener('click',()=>setPlaying(!playing));
$('step').addEventListener('click',()=>{setPlaying(false);clock+=stress?1/60:current.seconds/Math.max(8,current.frames);$('phase').value=(clock%(stress?4:current.seconds+.28))/(stress?4:current.seconds+.28);});
$('phase').addEventListener('input',()=>{setPlaying(false);clock=Number($('phase').value)*(stress?4:current.seconds+.28);});
window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!['INPUT','BUTTON','SELECT','A'].includes(document.activeElement.tagName)){e.preventDefault();setPlaying(!playing);}
});
atlas.onload=()=>{ready=true;$('status').textContent=data.recipes.length+' mẫu · Atlas '+atlas.width+' × '+atlas.height+' · Số lớp hiển thị là của trình duyệt.';};
atlas.onerror=()=>{$('status').textContent='Không tìm thấy atlas. Hãy giữ nguyên VFX_Handoff và Assets cạnh nhau sau khi giải nén.';};
atlas.src='../Assets/CatTanksVfxKit/Resources/CatTanksVfxKit/atlas.png';
drawLandscape();list();updateHeading();requestAnimationFrame(tick);
</script>
